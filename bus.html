<!-- transport er dropdown k control korbe -->
 <script>
  const transportBtn = document.getElementById("transportBtn");
  const transportMenu = document.getElementById("transportMenu");

  // Toggle dropdown on click
  transportBtn.addEventListener("click", () => {
    transportMenu.classList.toggle("hidden");
  });

  // Hide dropdown when clicking outside
  window.addEventListener("click", (e) => {
    if (!transportBtn.contains(e.target) && !transportMenu.contains(e.target)) {
      transportMenu.classList.add("hidden");
    }
  });
</script>
