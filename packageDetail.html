<!-- package detail -->
<div class="max-w-[1200px] mx-auto mt-15 mb-15">
<!-- left r right side er parent div -->
 <div class="flex gap-6 p-6">
  <!-- Left Side -->
  <div class="w-2/3">
    <img id="package-image" class="w-full h-64 object-cover rounded-lg mb-4" src="https://i.ibb.co.com/jZjLNLtn/Nilgiri-Hill-Bandarban-City.jpg"alt="Package Image">
    <h2 id="package-name" class="text-2xl font-bold text-blue-600 mb-2"></h2>
    <p id="package-description" class="text-gray-700 mb-4"></p>
    <p id="package-price" class="text-lg font-semibold text-orange-600 mb-4"></p>

    <!-- Navigation Tabs -->
    <div class="flex gap-4 border-b pb-2 mb-4">
      <button onclick="showSection('overview')" class="text-blue-500 font-semibold">Overview</button>
      <button onclick="scrollToSection('include')" class="text-blue-500 font-semibold">Include</button>
      <button onclick="scrollToSection('exclude')" class="text-blue-500 font-semibold">Exclude</button>
      <button onclick="scrollToSection('itinerary')" class="text-blue-500 font-semibold">Itinerary</button>
      <button onclick="scrollToSection('food')" class="text-blue-500 font-semibold">Food</button>
      <button onclick="scrollToSection('hotel')" class="text-blue-500 font-semibold">Hotel</button>
    </div>

    <!-- Sections -->
    <div id="overview" class="mb-6">
      <h3 class="text-gray-400 text-xl font-bold">Overview</h3>
      <p id="package-overview" class="text-gray-600"></p>
    </div>

    <div id="include" class="mb-6">
      <h3 class="text-gray-400 text-xl font-bold">Include</h3>
      <p id="package-include" class="text-gray-600"></p>
    </div>

    <div id="exclude" class="mb-6">
      <h3 class="text-gray-400  text-xl font-bold">Exclude</h3>
      <p id="package-exclude" class="text-gray-600"></p>
    </div>

    <div id="itinerary" class="mb-6">
      <h3 class="text-gray-400 text-xl font-bold">Itinerary</h3>
      <p id="package-itinerary" class="text-gray-600"></p>
    </div>

    <div id="food" class="mb-6">
      <h3 class="text-gray-400 text-xl font-bold">Food</h3>
      <p id="package-food" class="text-gray-600"></p>
    </div>

    <div id="hotel" class="mb-6">
      <h3 class="text-gray-400 text-xl font-bold">Hotel</h3>
      <p id="package-hotel" class="text-gray-600"></p>
    </div>
  </div>

  <!-- Right Side Booking Form -->
  <div class="w-1/3 bg-gray-100 p-4 rounded-lg shadow-md">
    <h3 class="text-xl font-bold mb-4">Book This Package</h3>
    <form id="booking-form">
      <input type="text" id="name" placeholder="Your Name" class="w-full mb-2 p-2 border rounded">
      <input type="email" id="email" placeholder="Your Email" class="w-full mb-2 p-2 border rounded">
      <input type="text" id="location" placeholder="Your Location" class="w-full mb-2 p-2 border rounded">
      <input type="date" id="date" class="w-full mb-2 p-2 border rounded">
      <input type="number" id="people" placeholder="Number of People" class="w-full mb-2 p-2 border rounded">

      <p id="total-price" class="text-lg font-semibold text-orange-600 mb-4">Total: ৳ 0</p>

      <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded">Confirm Booking</button>
    </form>
  </div>
</div>
